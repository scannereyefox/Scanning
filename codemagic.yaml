workflows:
  android-apk:
    name: Android APK
    environment:
      android_signing:
        - keystore_reference
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build Android
        script: |
          npx cap sync android
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/app-release.apk
